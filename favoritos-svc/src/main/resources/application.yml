spring:
  application:
    name: favoritos-svc
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chefia_favoritos}
    username: ${SPRING_DATASOURCE_USERNAME:chefia}
    password: ${SPRING_DATASOURCE_PASSWORD:chefia_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/chefia}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/chefia/protocol/openid-connect/certs}

services:
  recetas:
    url: ${RECETAS_SERVICE_URL:http://localhost:8082}

resilience4j:
  circuitbreaker:
    instances:
      recetasFavoritos:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
  retry:
    instances:
      recetasFavoritos:
        max-attempts: 2
        wait-duration: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
