events {}
http {
  upstream auth { server auth-svc:8080; }
  upstream usuarios { server usuarios-svc:8080; }
  upstream recetas { server recetas-svc:8080; }
  upstream favoritos { server favoritos-svc:8080; }
  upstream recomendaciones { server recomendaciones-svc:8080; }

  server {
    listen 80;
    client_max_body_size 1m;
    location = /health { default_type text/plain; return 200 "ok\n"; }

    location /api/auth/ {
      proxy_pass http://auth;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/admin/usuarios {
      proxy_pass http://auth;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/usuarios/ {
      proxy_pass http://usuarios;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/recetas {
      proxy_pass http://recetas;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/favoritos {
      proxy_pass http://favoritos;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/recomendar {
      proxy_pass http://recomendaciones;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/recomendaciones {
      proxy_pass http://recomendaciones;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

  }
}
