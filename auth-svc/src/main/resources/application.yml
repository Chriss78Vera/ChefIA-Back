spring:
  application:
    name: auth-svc
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/chefia}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/chefia/protocol/openid-connect/certs}

keycloak:
  internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
  public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  public-host: ${KEYCLOAK_PUBLIC_HOST:localhost:8180}
  realm: ${KEYCLOAK_REALM:chefia}
  public-client-id: ${KEYCLOAK_PUBLIC_CLIENT_ID:chefia-app}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
